# Pity Party game server: one Worker + one SQLite-backed Durable Object per table (Workers Free plan).
name = "pity-party-server"
main = "src/index.ts"
compatibility_date = "2025-07-18"
workers_dev = true

[vars]
# Comma-separated origins allowed to open tables / websockets ("*" during local dev).
ALLOWED_ORIGINS = "https://pity-party.pages.dev,http://localhost:5173,http://localhost:4173,http://127.0.0.1:4173"
# Public site that fronts /api/auth/* (Pages Functions proxy): OAuth redirect URIs, passkey RP ID, cookie site.
PUBLIC_ORIGIN = "https://pity-party.pages.dev"
# Chat moderators (Release 9): usernames, comma-separated, case-insensitive. Empty = nobody.
ADMIN_USERNAMES = "M33CH"
# Sign-in providers turn on only when BOTH of their secrets exist (npx wrangler secret put …):
#   GOOGLE_CLIENT_ID / GOOGLE_CLIENT_SECRET · DISCORD_CLIENT_ID / DISCORD_CLIENT_SECRET
#   X_CLIENT_ID / X_CLIENT_SECRET · FACEBOOK_APP_ID / FACEBOOK_APP_SECRET
# Passkeys need no secrets. AUTH_MOCK=1 (local tests only) adds a fake provider.
# TURN (optional, later): set these as secrets to hand out Cloudflare Realtime TURN credentials via /api/ice
#   npx wrangler secret put TURN_KEY_ID
#   npx wrangler secret put TURN_KEY_API_TOKEN
# Web Push (Release 13): generate once locally (see your_files/notifications-design.md §7), then
#   npx wrangler secret put VAPID_PUBLIC_KEY
#   npx wrangler secret put VAPID_PRIVATE_KEY
#   npx wrangler secret put VAPID_SUBJECT   (e.g. mailto:you@example.com)
# Without these, /api/push/vapid-key returns 503 and no pushes are sent.

[[durable_objects.bindings]]
name = "TABLES"
class_name = "TableDO"

# Player feedback (one instance; messages + screenshot blobs in SQLite). Secrets:
#   FEEDBACK_ADMIN_TOKEN (admin page), optional FEEDBACK_EMAIL_TO + RESEND_API_KEY (+ FEEDBACK_EMAIL_FROM) for email
[[durable_objects.bindings]]
name = "FEEDBACK"
class_name = "FeedbackDO"

# Free plan: Durable Objects must use the SQLite storage backend.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["TableDO"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["FeedbackDO"]

# Per-IP create / join / sign-in limits (in-memory sliding windows, one object per hashed IP)
[[durable_objects.bindings]]
name = "LIMITER"
class_name = "RateLimitDO"

# Push notifications (Release 13): daily-bonus + season-ending reminders run hourly.
[triggers]
crons = ["5 * * * *"]

[[migrations]]
tag = "v3"
new_sqlite_classes = ["RateLimitDO"]

# Release 9: the Social hub (presence, invites, global chat; friends/DMs live in D1). One instance, hibernating websockets.
# Chat moderators: ADMIN_USERNAMES (comma-separated usernames) and/or ADMIN_USER_IDS (account ids).
[[durable_objects.bindings]]
name = "SOCIAL"
class_name = "SocialDO"

[[migrations]]
tag = "v4"
new_sqlite_classes = ["SocialDO"]

# Release 9b: one Durable Object per tournament (bracket state, check-in + start alarms)
[[durable_objects.bindings]]
name = "TOURNAMENTS"
class_name = "TournamentDO"

[[migrations]]
tag = "v5"
new_sqlite_classes = ["TournamentDO"]

# Big Bank Take Lil Bank (Phase 1): one Durable Object per wager challenge (accept/escrow choreography, check-in + start alarms)
[[durable_objects.bindings]]
name = "CHALLENGES"
class_name = "ChallengeDO"

[[migrations]]
tag = "v6"
new_sqlite_classes = ["ChallengeDO"]

# Workers AI is OFF for Pity Party (free tier is shared with BWM): no [ai] binding. env.AI is optional in code,
# so the Voice (c) line writer simply never runs. Do not add [ai] without Demetrius' OK (docs/plan/DEPLOY.md).

# Accounts (users, linked logins, passkeys, sessions, progress). Free tier. Schema: migrations/
[[d1_databases]]
binding = "DB"
database_name = "pity-party"
database_id = "00000000-0000-0000-0000-000000000000" # PLACEHOLDER: fill with the id printed by `wrangler d1 create pity-party` (docs/plan/DEPLOY.md)
migrations_dir = "migrations"
